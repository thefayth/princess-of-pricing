<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Prince of Pricing</title></head>
  <body><main><header><span>PoP</span><strong>Price and checkout review</strong></header><p id="status">Nothing is read until you press a button.</p><button id="observe" type="button">Observe active product</button><label for="codes">Codes to test (up to 10)</label><textarea id="codes" rows="3" placeholder="One code per line"></textarea><button id="promo" type="button">Test codes on this checkout</button><small>PoP never reads payment fields or submits an order. It restores the promo field after each attempt.</small></main><script type="module" src="popup.js"></script></body>
</html>
